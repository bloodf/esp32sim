<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>esp32sim — ESP32 emulator & IDE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='24' height='24' rx='3' fill='%231565c0'/><rect x='9' y='9' width='14' height='14' fill='%23b0bec5'/></svg>">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo"></span><span class="brand-text">esp32sim</span></div>
    <div class="menu">
      <button id="btn-file" title="Project">Project ▾</button>
      <div class="dropdown" id="menu-file">
        <button data-act="new">New project…</button>
        <button data-act="open">Open project…</button>
        <div class="sep"></div>
        <div id="recent-list"></div>
        <div class="sep"></div>
        <button data-act="save-all">Save all  (Ctrl+Shift+S)</button>
        <button data-act="reload">Reload simulation</button>
        <button data-act="erase-flash">Erase flash data (NVS / files)</button>
        <button data-act="settings">Settings…</button>
      </div>
    </div>
    <div class="project-name" id="project-name">no project</div>
    <div class="spacer"></div>
    <div class="runctl">
      <button id="btn-build" class="primary" title="Build with PlatformIO and load into the simulator (Ctrl+B)">⚙ Build &amp; Run</button>
      <button id="btn-run" title="Run / continue (F5)">▶</button>
      <button id="btn-pause" title="Pause (F6)">⏸</button>
      <button id="btn-reset" title="Reset the ESP32">⟲</button>
      <select id="speed" title="Simulation speed">
        <option value="0.1">0.1×</option>
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1× real time</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="0">max</option>
      </select>
      <button id="btn-sound" title="Buzzer sound on/off">🔇</button>
    </div>
    <div class="status" id="status">
      <span class="dot" id="status-dot"></span><span id="status-text">idle</span>
      <span class="metric" id="status-time"></span>
      <span class="metric" id="status-mips"></span>
    </div>
  </header>
  <main id="main">
    <nav id="activity">
      <button data-panel="explorer" class="active" title="Files">🗂</button>
      <button data-panel="parts" title="Parts">🧩</button>
      <button data-panel="git" title="Source control">⎇</button>
      <button data-panel="ai" title="AI assistant">✨</button>
      <button data-panel="debug" title="Debugger">🐞</button>
      <div class="grow"></div>
      <button data-act="settings" title="Settings">⚙</button>
    </nav>
    <aside id="side">
      <section class="panel active" id="panel-explorer">
        <div class="panel-head">EXPLORER <span class="actions"><button id="new-file" title="New file">＋</button><button id="new-folder" title="New folder">📁</button><button id="refresh-files" title="Refresh">⟳</button></span></div>
        <div id="file-tree" class="tree"></div>
      </section>
      <section class="panel" id="panel-parts">
        <div class="panel-head">PARTS</div>
        <input id="parts-search" class="search" placeholder="Search parts…">
        <div id="parts-list"></div>
      </section>
      <section class="panel" id="panel-git">
        <div class="panel-head">SOURCE CONTROL <span class="actions"><button id="git-refresh" title="Refresh">⟳</button></span></div>
        <div id="git-body"></div>
      </section>
      <section class="panel" id="panel-ai">
        <div class="panel-head">AI ASSISTANT <span class="actions"><button id="ai-clear" title="New chat">📝</button><button id="ai-settings" title="AI settings">⚙</button></span></div>
        <div id="ai-body"></div>
      </section>
      <section class="panel" id="panel-debug">
        <div class="panel-head">DEBUG</div>
        <div id="debug-body"></div>
      </section>
    </aside>
    <div id="center">
      <div id="tabs"></div>
      <div id="views">
        <div class="view active" id="view-circuit">
          <div id="circuit-toolbar" title="Click a pin to start a wire · drag parts · Del removes the selection · Ctrl+Z undo">
            <button id="cz-fit" title="Fit to screen">⤢</button>
            <button id="cz-in" title="Zoom in">＋</button>
            <button id="cz-out" title="Zoom out">－</button>
            <button id="cz-undo" title="Undo (Ctrl+Z)">↶</button>
            <button id="cz-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
            <span class="hint" id="circuit-hint">Click a pin to start a wire · drag parts · Del removes the selection · Ctrl+Z undo</span>
          </div>
          <svg id="circuit" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="view" id="view-editor"><div id="editor"></div></div>
        <div class="view" id="view-diff"><div id="diff-editor"></div></div>
      </div>
      <div id="bottom-resizer"></div>
      <div id="bottom">
        <div id="bottom-tabs">
          <button data-bottom="serial" class="active">Serial</button>
          <button data-bottom="plot">Plotter</button>
          <button data-bottom="logic">Logic</button>
          <button data-bottom="bus">Bus</button>
          <button data-bottom="build">Build</button>
          <button data-bottom="problems">Problems <span id="problem-count"></span></button>
          <button data-bottom="log" title="Emulator log">Log</button>
          <div class="grow"></div>
          <span id="serial-controls">
            <select id="serial-eol" title="Line ending"><option value="\n">LF</option><option value="\r\n">CR+LF</option><option value="\r">CR</option><option value="">none</option></select>
            <button id="serial-clear" title="Clear">🧹</button>
          </span>
        </div>
        <div class="bview active" id="bview-serial">
          <div id="terminal"></div>
          <form id="serial-form"><input id="serial-input" placeholder="Send to serial (Enter)… — typing in the terminal sends keys directly" autocomplete="off"></form>
        </div>
        <div class="bview" id="bview-plot"></div>
        <div class="bview" id="bview-logic"></div>
        <div class="bview" id="bview-bus"></div>
        <div class="bview" id="bview-build"><pre id="build-log"></pre></div>
        <div class="bview" id="bview-problems"><div id="problems"></div></div>
        <div class="bview" id="bview-log"><pre id="emu-log"></pre></div>
      </div>
    </div>
    <aside id="inspector">
      <div class="panel-head">INSPECTOR</div>
      <div id="inspector-body"><p class="muted">Select a part on the circuit to see its state and controls.</p></div>
    </aside>
  </main>
</div>
<div id="modal" class="hidden"><div class="modal-box"><div class="modal-head"><span id="modal-title"></span><button id="modal-close">✕</button></div><div id="modal-body"></div></div></div>
<div id="toast"></div>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="vendor/monaco/vs/loader.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>

# Tests (no ESP32 hardware needed) and desktop installers.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace

  scenarios:
    name: Real firmware scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p esp32sim --test scenarios -- --ignored

  gui:
    name: GUI unit + end-to-end tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - run: cargo build --release -p esp32sim
      - run: npm ci
        working-directory: ui-tests
      - run: npx playwright install --with-deps chromium
        working-directory: ui-tests
      - run: npm run test:unit
        working-directory: ui-tests
      - run: npx playwright test
        working-directory: ui-tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui-tests/playwright-report
            ui-tests/test-results

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Shell tests (mock runtime)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --no-default-features --features mock
      - name: Build installers
        run: |
          cargo install tauri-cli --version '^2' --locked
          cd desktop/src-tauri && cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32sim-desktop-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/

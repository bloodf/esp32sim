# Desktop installers for every platform, published as a GitHub release.
# Trigger: push a tag like v0.1.0 (or run manually with an existing tag).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ''
          - name: Windows x64
            os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: esp32sim ${{ github.ref_name }}
          releaseBody: |
            Desktop app: ESP32 emulator, circuit simulator and IDE.

            **Downloads**
            * macOS (Apple Silicon + Intel): `.dmg`
            * Windows: `.msi` or `-setup.exe`
            * Linux: `.AppImage`, `.deb` or `.rpm`

            The builds are not code-signed yet:
            * **macOS**: if it says the app is damaged or can't be opened, run `xattr -cr /Applications/esp32sim.app`, then open it again.
            * **Windows**: SmartScreen may warn; click *More info* → *Run anyway*.

            Compiling firmware inside the app needs PlatformIO (`pip install platformio`); prebuilt `.bin`/`.elf` images run without it.
          releaseDraft: false
          prerelease: false
